name: Check Maghrib +30m and send to WhatsApp

# Runs every 10 minutes. The script itself only sends inside the
# 15-minute window after Maghrib+30m in Cairo, and only once per day.
# State lives in Supabase (bot_state), so GitHub Actions and a local
# run share the same counter — no double-send.
# NOTE: WhatsApp session in ./auth must be restored from a secret.
# See README.md — an always-on VPS is more reliable than this.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      send_now:
        description: 'Send immediately (instant test — ignores prayer time)'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Verify auth parts (lengths only — values are never printed)
        # GitHub never shows secret values, only their names.
        # This step prints only the LENGTH of each part, so you can check
        # on GitHub that every part arrived: parts 1-6 should be 40000,
        # the last used part shorter, unused parts 0. A 0 or a short
        # length in the middle means that secret is missing / truncated.
        env:
          P1: ${{ secrets.AUTH_BASE64_1 }}
          P2: ${{ secrets.AUTH_BASE64_2 }}
          P3: ${{ secrets.AUTH_BASE64_3 }}
          P4: ${{ secrets.AUTH_BASE64_4 }}
          P5: ${{ secrets.AUTH_BASE64_5 }}
          P6: ${{ secrets.AUTH_BASE64_6 }}
          P7: ${{ secrets.AUTH_BASE64_7 }}
          P8: ${{ secrets.AUTH_BASE64_8 }}
          P9: ${{ secrets.AUTH_BASE64_9 }}
          P10: ${{ secrets.AUTH_BASE64_10 }}
          P0: ${{ secrets.AUTH_BASE64 }}
        run: |
          echo "single AUTH_BASE64: ${#P0}"
          echo "part1: ${#P1}"
          echo "part2: ${#P2}"
          echo "part3: ${#P3}"
          echo "part4: ${#P4}"
          echo "part5: ${#P5}"
          echo "part6: ${#P6}"
          echo "part7: ${#P7}"
          echo "part8: ${#P8}"
          echo "part9: ${#P9}"
          echo "part10: ${#P10}"
          total=$(( ${#P0} + ${#P1} + ${#P2} + ${#P3} + ${#P4} + ${#P5} + ${#P6} + ${#P7} + ${#P8} + ${#P9} + ${#P10} ))
          echo "total: $total"
          if [ "$total" -eq 0 ]; then echo "FAIL: no auth parts found in secrets"; exit 1; fi
      - name: Restore WhatsApp auth
        # GitHub Secrets are limited to 48 KB each, and AUTH_BASE64 is
        # usually bigger than that. So it is split into 40 KB parts:
        # AUTH_BASE64_1, AUTH_BASE64_2, ... up to _10 (see scripts/split-auth.ps1).
        # A single AUTH_BASE64 secret still works too — the parts are
        # just concatenated, empty ones add nothing.
        run: |
          mkdir -p auth
          echo "${{ secrets.AUTH_BASE64 }}${{ secrets.AUTH_BASE64_1 }}${{ secrets.AUTH_BASE64_2 }}${{ secrets.AUTH_BASE64_3 }}${{ secrets.AUTH_BASE64_4 }}${{ secrets.AUTH_BASE64_5 }}${{ secrets.AUTH_BASE64_6 }}${{ secrets.AUTH_BASE64_7 }}${{ secrets.AUTH_BASE64_8 }}${{ secrets.AUTH_BASE64_9 }}${{ secrets.AUTH_BASE64_10 }}" | base64 -d | tar xz -C auth
          # Fix nested folder: `tar -czf auth.tar.gz auth` stores auth/creds.json,
          # so extracting into auth/ gives auth/auth/creds.json — Baileys
          # looks in auth/creds.json and would ask for a QR again. Flatten it.
          if [ -f auth/auth/creds.json ]; then mv auth/auth/* auth/; rmdir auth/auth; fi
          ls -la auth
          if [ ! -f auth/creds.json ]; then echo "FAIL: auth/creds.json not found after restore — AUTH_BASE64 parts are wrong or empty"; exit 1; fi
      - name: Check and send if due
        env:
          CITY: Cairo
          COUNTRY: Egypt
          METHOD: 5
          TIMEZONE: Africa/Cairo
          PRAYER: Maghrib
          DELAY_MINUTES: 30
          WINDOW_MINUTES: 15
          # Supabase images + state (Amir's setup: bucket QuranWerd, images in root, .png)
          IMAGE_SOURCE: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IMAGE_FOLDER: ""
          IMAGE_EXT: png
          MAX_IMAGES: 999
          GROUP_JID: ${{ secrets.GROUP_JID }}
          CAPTION_TEMPLATE: ${{ secrets.CAPTION_TEMPLATE }}
          FRIDAY_TEXT: ${{ secrets.FRIDAY_TEXT }}
        # Manual run with send_now=true sends immediately (instant test).
        # Scheduled runs always use --check (only in the Maghrib+30m window).
        run: |
          if [ "${{ inputs.send_now }}" = "true" ]; then node index.js --send-now; else node index.js --check; fi
