name: Check Maghrib +30m and send to WhatsApp

# Runs every 10 minutes. The script itself only sends inside the
# 15-minute window after Maghrib+30m in Cairo, and only once per day.
# State lives in Supabase (bot_state), so GitHub Actions and a local
# run share the same counter — no double-send.
# NOTE: WhatsApp session in ./auth must be restored from a secret.
# See README.md — an always-on VPS is more reliable than this.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Restore WhatsApp auth
        # GitHub Secrets are limited to 48 KB each, and AUTH_BASE64 is
        # usually bigger than that. So it is split into 40 KB parts:
        # AUTH_BASE64_1, AUTH_BASE64_2, ... (see scripts/split-auth.ps1).
        # A single AUTH_BASE64 secret still works too — the parts are
        # just concatenated, empty ones add nothing.
        run: |
          mkdir -p auth
          echo "${{ secrets.AUTH_BASE64 }}${{ secrets.AUTH_BASE64_1 }}${{ secrets.AUTH_BASE64_2 }}${{ secrets.AUTH_BASE64_3 }}${{ secrets.AUTH_BASE64_4 }}" | base64 -d | tar xz -C auth
          ls -la auth
      - name: Check and send if due
        env:
          CITY: Cairo
          COUNTRY: Egypt
          METHOD: 5
          TIMEZONE: Africa/Cairo
          PRAYER: Maghrib
          DELAY_MINUTES: 30
          WINDOW_MINUTES: 15
          # Supabase images + state (Amir's setup: bucket QuranWerd, images in root, .png)
          IMAGE_SOURCE: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IMAGE_FOLDER: ""
          IMAGE_EXT: png
          MAX_IMAGES: 999
          GROUP_JID: ${{ secrets.GROUP_JID }}
          CAPTION_TEMPLATE: ${{ secrets.CAPTION_TEMPLATE }}
          FRIDAY_TEXT: ${{ secrets.FRIDAY_TEXT }}
        run: node index.js --check
